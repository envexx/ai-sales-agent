services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sales-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    volumes:
      - sales_pgdata:/var/lib/postgresql/data
      # Runs once on an empty data volume. The app also ensures the schema on boot.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Port-forwarder ke SearXNG milik stack Firecrawl (network eksternal).
  # Dipakai Research Agent untuk discovery URL yang andal. Ini TIDAK mengubah
  # compose Firecrawl — hanya menempel ke network-nya dan meneruskan port 8081.
  searxng-proxy:
    image: alpine/socat
    container_name: sales-searxng-proxy
    restart: unless-stopped
    command: tcp-listen:8080,fork,reuseaddr tcp:firecrawl-searxng-1:8080
    ports:
      - "8081:8080"
    networks:
      - firecrawl_backend

volumes:
  sales_pgdata:

networks:
  # Dibuat oleh stack Firecrawl milik sistem lain; kita hanya memakainya.
  firecrawl_backend:
    external: true
