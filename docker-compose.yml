services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sales-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    volumes:
      - sales_pgdata:/var/lib/postgresql/data
      # Runs once on an empty data volume. The app also ensures the schema on boot.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sales_pgdata:
